id = "herdr-desk"
name = "Herdr Desk"
version = "0.1.8" # x-release-please-version
description = "Scheduled repo managers: pick up .herdr-desk.json from open workspaces and fire start/wrap Grok managers"
# 0.8.0, not 0.7.0: the `card` popup below uses `placement = "popup"`, which
# 0.7.0's PluginPanePlacement does not have. Herdr refuses to link a plugin whose
# minimum is newer than the binary, so declaring the older floor here would let a
# 0.7.x host fail manifest parsing instead of being told why.
min_herdr_version = "0.8.0"
platforms = ["linux", "macos"]

[[startup]]
command = ["bin/desk", "start"]

[[actions]]
id = "start"
title = "Start the desk daemon"
command = ["bin/desk", "start"]

[[actions]]
id = "stop"
title = "Stop the desk daemon"
command = ["bin/desk", "stop"]

[[actions]]
id = "hub"
title = "Show what every job on the machine is doing"
command = ["bin/desk", "hub"]

[[actions]]
id = "status"
title = "Show daemon, cron slots, last/next fire"
command = ["bin/desk", "status"]

[[actions]]
id = "agenda"
title = "Show upcoming fires per slot for the next 7 days"
command = ["bin/desk", "agenda"]

[[actions]]
id = "next"
title = "Show the next 5 fires across the machine"
command = ["bin/desk", "next"]

[[actions]]
id = "pause"
title = "Pause every job until resumed"
command = ["bin/desk", "pause", "--all"]

[[actions]]
id = "resume"
title = "Resume every paused job"
command = ["bin/desk", "resume", "--all"]

[[actions]]
id = "timeline"
title = "Show one lane per job for the next 7 days"
command = ["bin/desk", "timeline"]

[[actions]]
id = "heatmap"
title = "Show 7x24 scheduled fire density"
command = ["bin/desk", "heatmap"]

[[actions]]
id = "heatmap-actual"
title = "Show 7x24 density of actual fires from the ledger"
command = ["bin/desk", "heatmap", "--actual"]

[[actions]]
id = "analytics"
title = "Show success rate, skip and failure causes for 30 days"
command = ["bin/desk", "analytics"]

[[actions]]
id = "calendar"
title = "Print the next 7 days of fires as iCalendar"
command = ["bin/desk", "calendar"]

[[actions]]
id = "board"
title = "Write a static HTML board to the state dir"
command = ["bin/desk", "board", "--html"]

[[actions]]
id = "serve"
title = "Serve the dashboard on localhost, and on Tailscale when this node is online"
command = ["bin/desk", "serve"]

[[actions]]
id = "sessions-index"
title = "Index local agent sessions (Claude, Codex, Gemini, Grok, desk runs)"
command = ["bin/desk", "sessions", "index"]

[[actions]]
id = "sessions"
title = "Show recent agent sessions across repos"
command = ["bin/desk", "sessions"]

[[actions]]
id = "list"
title = "List desks picked up from repos"
command = ["bin/desk", "scan"]

[[actions]]
id = "history"
title = "Show recent desk run history"
command = ["bin/desk", "history"]

[[actions]]
id = "watch"
title = "Poll this repo's watchers once (the cwd), print what they saw (fires nothing)"
command = ["bin/desk", "watch"]

[[actions]]
id = "watch-status"
title = "Show every watched task: pending, overflow, fails, last and next poll"
command = ["bin/desk", "watch", "status"]

[[actions]]
id = "watch-test"
title = "Run this repo's watcher directly (the cwd): argv, cwd, exit, stderr, events parsed"
command = ["bin/desk", "watch", "test"]

[[actions]]
id = "cleanup-dry-run"
title = "List merged worktrees, old run dirs and stale panes a cleanup would remove"
command = ["bin/desk", "cleanup", "--dry-run"]

[[actions]]
id = "cleanup"
title = "Remove merged worktrees, old run dirs and stale panes (what cleanup-dry-run lists)"
command = ["bin/desk", "cleanup"]

[[actions]]
id = "last"
title = "Show today's start-run change summaries"
command = ["bin/desk", "last"]

[[actions]]
id = "summary"
title = "Preview the summary prompt for the last day (no agent run)"
command = ["bin/desk", "summary", "--dry-run"]

[[actions]]
id = "notify"
title = "Send a Telegram notice tagged with machine and repo"
command = ["bin/desk", "notify"]

[[actions]]
id = "validate"
title = "Validate discovered repo configs"
command = ["bin/desk", "validate"]

[[actions]]
id = "prompts"
title = "Show prompt/task registries and what is approved"
command = ["bin/desk", "prompts", "list"]

[[actions]]
id = "update-check"
title = "Check GitHub for a newer herdr-desk release"
command = ["bin/desk", "update", "--check"]

[[actions]]
id = "update"
title = "Upgrade herdr-desk to the latest release and restart the daemon"
command = ["bin/desk", "update"]

# Resolves the workspace Herdr invokes this for out of HERDR_PLUGIN_CONTEXT_JSON /
# HERDR_WORKSPACE_ID and prints that repo's jobs, config path, dashboard URL and
# next fire. `contexts` is declared because it is the correct declaration, not
# because Herdr acts on it: PluginActionContext has no consumer in Herdr 0.9.3, so
# this does NOT appear in the sidebar right-click menu. See docs/setup.md.
[[actions]]
id = "here"
title = "Show the desk for the workspace in focus (jobs, config, dashboard)"
contexts = ["workspace"]
command = ["bin/desk", "here"]

# The same card, modal. Herdr closes a popup when its command exits, hence
# `--wait`. Herdr passes the same plugin context to pane commands.
[[panes]]
id = "card"
title = "Herdr Desk"
description = "This workspace's desk: jobs, config path, dashboard, next fire"
placement = "popup"
width = "90%"
height = 24
command = ["bin/desk", "here", "--wait"]

[[events]]
on = "workspace.focused"
command = ["bin/desk", "on-focus"]
